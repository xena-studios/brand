name: Site

# Builds brand.xenastudios.co from a release and deploys it to the xena-brand
# Cloudflare Worker. The Release workflow runs it after each release; run it by hand
# (Actions → Site → Run workflow) to redeploy the latest release, for example after a
# change to the site alone.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency: site

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The Cloudflare token lives in the production environment, which only main and
    # release tags can use, and only the deploy step sees it.
    environment:
      name: production
      url: https://brand.xenastudios.co
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # By hand: the latest release, with the site as it is on main (a site fix ships
      # without a brand release).
      - name: Check out the release
        working-directory: .
        env:
          REF: ${{ inputs.ref }}
        run: |
          tag="${REF:-$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA")}"
          git -c advice.detachedHead=false checkout --quiet "$tag"
          git checkout --quiet "$GITHUB_SHA" -- site
          echo "Building the site for $tag"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
