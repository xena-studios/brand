name: Check

# Every pull request: the scripts type-check, every SVG renders and has its PNG, tokens
# parse, the docs' images and links exist (pnpm verify), and the committed files are
# exactly what the build makes (pnpm check, which renders everything). The build needs
# no licensed font: Ethnocentric draws only logo/ and people/, which pnpm build reads back.
# main requires this job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; runs on main all finish.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm check
      # On a mismatch, the files the build made, to compare with what's committed.
      - if: failure()
        run: git status --porcelain | awk '{print $2}' > changed.txt
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rebuilt-files
          path: |
            changed.txt
            **/*.png
            **/*.svg
            !node_modules/**
          if-no-files-found: ignore
