name: Check

# The build needs fonts that can't be in the repo (Ethnocentric is licensed),
# so CI can't rebuild and diff like `pnpm check` does locally. It checks the
# rest on every pull request: the scripts type-check, every SVG renders and has
# its PNG, tokens parse, and the README's images and links exist. main requires it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
