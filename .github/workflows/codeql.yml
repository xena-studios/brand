name: CodeQL

# Code scanning: the build scripts and the workflows, read from source with no
# build. Findings show on pull requests and in the Security tab. Dependencies
# are Renovate's: it opens a fix PR as soon as one has a known vulnerability.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for new queries against unchanged code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; runs on main all finish.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
